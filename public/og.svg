<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="block1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="block2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="block3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="block4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <g opacity="0.12">
    <circle cx="150" cy="150" r="120" fill="#8b5cf6"/>
    <circle cx="1050" cy="150" r="140" fill="#ec4899"/>
    <circle cx="200" cy="480" r="80" fill="#3b82f6"/>
    <circle cx="1000" cy="500" r="100" fill="#f97316"/>
  </g>
  
  <!-- Block grid - Left side (enlarged to match text height) -->
  <g transform="translate(80, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="url(#block1)"/>
    <rect x="85" y="0" width="70" height="70" rx="12" fill="url(#block2)"/>
    <rect x="170" y="0" width="70" height="70" rx="12" fill="url(#block3)"/>
    <rect x="255" y="0" width="70" height="70" rx="12" fill="url(#block4)"/>
    
    <rect x="0" y="85" width="70" height="70" rx="12" fill="url(#block3)"/>
    <rect x="85" y="85" width="70" height="70" rx="12" fill="url(#block1)"/>
    <rect x="170" y="85" width="70" height="70" rx="12" fill="url(#block4)"/>
    <rect x="255" y="85" width="70" height="70" rx="12" fill="url(#block2)"/>
    
    <rect x="0" y="170" width="70" height="70" rx="12" fill="url(#block2)"/>
    <rect x="85" y="170" width="70" height="70" rx="12" fill="url(#block4)"/>
    <rect x="170" y="170" width="70" height="70" rx="12" fill="url(#block1)"/>
    <rect x="255" y="170" width="70" height="70" rx="12" fill="url(#block3)"/>
    
    <rect x="0" y="255" width="70" height="70" rx="12" fill="url(#block4)"/>
    <rect x="85" y="255" width="70" height="70" rx="12" fill="url(#block3)"/>
    <rect x="170" y="255" width="70" height="70" rx="12" fill="url(#block2)"/>
    <rect x="255" y="255" width="70" height="70" rx="12" fill="url(#block1)"/>
  </g>
  
  <!-- Main content - Right side (aligned with logo) -->
  <g transform="translate(500, 120)">
    <!-- Main title -->
    <text x="0" y="56" font-family="Arial, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="start" letter-spacing="-1">
      BLOCK BASED
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="121" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#a5f3fc" text-anchor="start">
      Puzzle Game on Base Network
    </text>
    
    <!-- Features list -->
    <g transform="translate(0, 181)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="start">
        ✦ 8×8 Grid Challenge
      </text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="start">
        ✦ Adventure & Classic Mode
      </text>
      <text x="0" y="76" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="start">
        ✦ 100 Exciting Levels
      </text>
      <text x="0" y="114" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.9)" text-anchor="start">
        ✦ More Games
      </text>
    </g>
  </g>
  
  <!-- Play button - Centered bottom -->
  <g transform="translate(600, 510)" filter="url(#glow)">
    <rect x="-90" y="-30" width="180" height="60" rx="30" fill="#8b5cf6"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">
      Play Now
    </text>
  </g>
</svg>